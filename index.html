<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>積立NISAシミュレーター</title>
</head>
<body>
    <h1>積立NISAシミュレーター</h1>

    <input id="monthly" type="number" placeholder="毎月の積立額（円）">
    <input id="rate"    type="number" placeholder="年利（%）">
    <input id="years"   type="number" placeholder="積立年数">
    <button onclick="calc()">計算する</button>

    <p id="result"></p>

    <script>
        function calc() {
            const monthly  = Number(document.getElementById("monthly").value)
            const yearRate = Number(document.getElementById("rate").value) / 100
            const years    = Number(document.getElementById("years").value)

            const monthRate = yearRate / 12

            let total = 0
            for (let month = 1; month <= years * 12; month++) {
                total = total * (1 + monthRate) + monthly
            }

            document.getElementById("result").textContent = "最終資産：" + Math.round(total).toLocaleString() + "円"
        }
    </script>
</body>
</html>

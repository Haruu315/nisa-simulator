<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>積立NISAシミュレーター</title>
</head>
<body>
    <h1>積立NISAシミュレーター</h1>

    <input id="monthly" type="number" placeholder="毎月の積立額（円）">
    <input id="rate"    type="number" placeholder="年利（%）">
    <input id="years"   type="number" placeholder="積立年数">
    <button onclick="calc()">計算する</button>

    <p id="result"></p>
    <canvas id="chart"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script>
        let myChart = null

        function calc() {
            const monthly  = Number(document.getElementById("monthly").value)
            const yearRate = Number(document.getElementById("rate").value) / 100
            const years    = Number(document.getElementById("years").value)
            const monthRate = yearRate / 12

            // 年ごとのデータを配列に貯める
            let total = 0
            const labels     = []  // 横軸のラベル（1年・2年...）
            const totalData  = []  // 資産総額
            const principalData = []  // 元本の累計

            for (let month = 1; month <= years * 12; month++) {
                total = total * (1 + monthRate) + monthly

                if (month % 12 === 0) {
                    let year = month / 12
                    labels.push(year + "年")
                    totalData.push(Math.round(total))
                    principalData.push(monthly * 12 * year)
                }
            }

            document.getElementById("result").textContent = "最終資産：" + Math.round(total).toLocaleString() + "円"

            // グラフを描く
            if (myChart) myChart.destroy()
            myChart = new Chart(document.getElementById("chart"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: "資産総額",
                            data: totalData,
                            borderColor: "blue"
                        },
                        {
                            label: "元本",
                            data: principalData,
                            borderColor: "gray"
                        }
                    ]
                }
            })
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>積立NISAシミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>積立NISAシミュレーター</h1>

    <input id="monthly" type="number" placeholder="毎月の積立額（円）">
    <input id="rate"    type="number" placeholder="年利（%）">
    <input id="years"   type="number" placeholder="積立年数">
    <button onclick="calc()">計算する</button>

    <p id="result"></p>
    <canvas id="chart"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="script.js"></script>

</html>
